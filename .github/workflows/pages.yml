name: Deploy simulator pages

on:
  push:
    branches: [main, odev/menu-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current simulator and site builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: current
          persist-credentials: false
      - name: Check out menu demonstrations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: odev/menu-demo
          path: menu-demo
          persist-credentials: false
      - name: Prepare static simulators
        run: node current/tools/build-pages.mjs --current current --demo menu-demo --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
